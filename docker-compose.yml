version: "3.9"

services:
  sorteo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sorteo-app
    restart: unless-stopped
    ports:
      - "81:81"
    volumes:
      - sorteo-db:/app/db
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:81/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  sorteo-db:
    driver: local
